[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 needs Node 18 or newer; pin a known version so builds are repeatable.
  NODE_VERSION = "22"

# Vite's built files have a content hash in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every page: no guessing file types, links to other sites carry only the domain, no camera or
# microphone, and location only for "Use my location" on the Analysis page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), geolocation=(self)"

# The globe's pictures and the bundled outlines change rarely; their names carry no hash, so a month.
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Single-page app: every route (/map, /analysis, …) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
